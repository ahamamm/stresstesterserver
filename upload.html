<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go File Upload</title>
</head>

<body>
    <h2>Upload a File to Go Server</h2>
    <!-- Note: action must match the Go endpoint, and enctype must be multipart/form-data -->
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="myFile" required>
        <select id="filetype" name="filetype" required>
            <option selected="selected" value="flowtemplates">flow template</option>
            <option value="messagetemplates">message template</option>
            <option value="files">other</option>
        </select>
        <br><br>
        <button type="submit">Upload File</button>
    </form>
</body>

</html>
